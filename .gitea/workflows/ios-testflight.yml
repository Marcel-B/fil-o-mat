name: iOS TestFlight

# Baut die App für iPhone/iPad und für den Mac (Mac Catalyst) und lädt beide zu TestFlight hoch, wie testflight.yml in
# den Tonwerk-Repos: Archiv ad hoc signiert, signiert wird beim Export mit dem Cloud-Zertifikat über den
# App-Store-Connect-API-Schlüssel (Rolle Admin). Läuft auf unseren eigenen Mac-Runnern (Label macos: Mac mini, oi-o-mat).
# Secrets im Gitea-Repo (dieselben Werte wie bei Tonwerk): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (oder ASC_PRIVATE_KEY),
# optional APPLE_TEAM_ID.
# Einrichtung: ios-app/TESTFLIGHT.md

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".gitea/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight (${{ matrix.name }})
    runs-on: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone und iPad
            platform: ios
            destination: generic/platform=iOS
          - name: Mac
            platform: macos
            destination: generic/platform=macOS,variant=Mac Catalyst
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '6GGU8ET2C4' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        id: secrets
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::TestFlight übersprungen, es fehlen Secrets:$missing (siehe ios-app/TESTFLIGHT.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Unsere Runner haben ein Xcode und kein sudo, um ein anderes zu wählen; das eingestellte wird nur geprüft.
      # App Store Connect nimmt nur Builds mit dem iOS-26-SDK oder neuer (ITMS-90725), ab April 2027 mit dem iOS-27-SDK.
      - name: Xcode prüfen
        if: steps.secrets.outputs.ok == 'true'
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')
          (( major >= 26 )) || { echo "::error::Xcode $major auf dem Runner, nötig ist 26 oder neuer"; exit 1; }
          (( major >= 27 )) || echo "::warning::Runner hat noch kein Xcode 27. Ab April 2027 nimmt App Store Connect nur Builds mit dem iOS-27-SDK an (ITMS-90725)."

      # Von Hand in Xcode archivierte Builds haben kleine Nummern. GitHub Actions lud 1000 + Laufnummer hoch (zuletzt 1018);
      # Gitea zählt wieder ab 1, deshalb 2000 + Laufnummer.
      - name: Build-Nummer
        if: steps.secrets.outputs.ok == 'true'
        run: echo "BUILD_NUMBER=$((2000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      # Der Runner läuft direkt auf dem Mac und teilt sich das Home mit anderen Jobs, deshalb liegt der Schlüssel im
      # Temp-Ordner des Laufs; altool findet ihn dort über API_PRIVATE_KEYS_DIR.
      - name: API-Schlüssel ablegen
        if: steps.secrets.outputs.ok == 'true'
        run: |
          dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$dir" >> "$GITHUB_ENV"

      # Ad hoc signiert, damit nicht jeder Runner ein eigenes Development-Zertifikat anlegt. Ganz unsigniert
      # (CODE_SIGNING_ALLOWED=NO) fehlen dem Archiv die Entitlements, und der Export lässt dann NFC weg.
      - name: Archiv bauen
        if: steps.secrets.outputs.ok == 'true'
        run: |
          xcodebuild archive -project Filomat.xcodeproj -scheme Filomat -configuration Release \
            -destination '${{ matrix.destination }}' -archivePath "$RUNNER_TEMP/Filomat.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER= \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -50; tail -100 "$RUNNER_TEMP/archive.log"; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/Filomat.xcarchive/Products/Applications/*.app | plutil -p - || true

      # iOS liefert eine .ipa, der Mac ein .pkg (dafür legt Xcode zusätzlich das Installer-Zertifikat an).
      - name: Signieren und exportieren
        if: steps.secrets.outputs.ok == 'true'
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>export</string>
              <key>teamID</key><string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key><string>automatic</string>
              <key>manageAppVersionAndBuildNumber</key><false/>
              <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Filomat.xcarchive" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Ohne die NFC-Berechtigung startet die App zwar, kann aber keine Tags lesen. Lieber hier abbrechen.
      # Der Mac hat kein NFC.
      - name: NFC-Berechtigung prüfen
        if: steps.secrets.outputs.ok == 'true' && matrix.platform == 'ios'
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/ipa/Payload/*.app > "$RUNNER_TEMP/entitlements.plist"
          plutil -p "$RUNNER_TEMP/entitlements.plist"
          grep -q "com.apple.developer.nfc.readersession.formats" "$RUNNER_TEMP/entitlements.plist" \
            || { echo "::error::Die signierte App hat keine NFC-Berechtigung"; exit 1; }
          echo "UPLOAD_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Paket für den Mac
        if: steps.secrets.outputs.ok == 'true' && matrix.platform == 'macos'
        run: |
          pkg=$(ls "$RUNNER_TEMP"/export/*.pkg)
          pkgutil --check-signature "$pkg"
          echo "UPLOAD_PATH=$pkg" >> "$GITHUB_ENV"

      - name: Zu TestFlight hochladen
        if: steps.secrets.outputs.ok == 'true'
        run: |
          xcrun altool --upload-app --type ${{ matrix.platform }} --file "$UPLOAD_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "${{ matrix.name }}: Build $BUILD_NUMBER hochgeladen. Nach der Verarbeitung (meist 5–15 Minuten) erscheint er in TestFlight."

      - name: Schlüssel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/export"
