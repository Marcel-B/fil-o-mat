name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".gitea/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".gitea/workflows/ios.yml"

jobs:
  build-and-test:
    runs-on: macos
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      # Unsere Mac-Runner haben ein Xcode und kein sudo, um ein anderes zu wählen; das eingestellte wird nur geprüft
      - name: Xcode prüfen
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')
          (( major >= 26 )) || { echo "::error::Xcode $major auf dem Runner, nötig ist 26 oder neuer"; exit 1; }

      - name: Für Gerät bauen (ohne Signierung, inkl. CoreNFC)
        run: |
          xcodebuild build \
            -project Filomat.xcodeproj \
            -scheme Filomat \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Für den Mac bauen (Mac Catalyst, ohne Signierung)
        run: |
          xcodebuild build \
            -project Filomat.xcodeproj \
            -scheme Filomat \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit-Tests im Simulator
        run: |
          # Ein iPhone der neuesten iOS-Laufzeit, über seine ID: auf dem Mac-Runner gibt es mehrere Laufzeiten mit
          # gleichnamigen Geräten, und der Name allein meint die neueste
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          d = json.load(sys.stdin)['devices']
          # Nur die normalen Laufzeiten (iOS-27-2), nicht die eigener Geräte (iOS-27-2-iPhone19-4)
          ver = lambda k: [int(n) for n in k.split('iOS-')[-1].split('-')]
          for k in sorted((k for k in d if re.search(r'\.iOS-\d+(-\d+)*$', k)), key=ver, reverse=True):
              phones = [x for x in d[k] if x['name'].startswith('iPhone')]
              if phones:
                  print(phones[0]['udid'], phones[0]['name'], k.split('.')[-1], file=sys.stderr)
                  print(phones[0]['udid'])
                  break
          ")
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -project Filomat.xcodeproj \
            -scheme Filomat \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -testLanguage de -testRegion DE \
            CODE_SIGNING_ALLOWED=NO
