name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".dockerignore"
      - ".gitea/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - ".dockerignore"
      - ".gitea/workflows/backend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Das Runner-Image hat anders als das von GitHub kein ICU; ohne bricht dotnet sofort ab
      - name: ICU installieren
        run: |
          command -v sudo >/dev/null && SUDO=sudo || SUDO=
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq libicu-dev >/dev/null
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test
      - name: Docker-Image bauen (mit Web-Oberfläche)
        working-directory: .
        run: docker build -f backend/Dockerfile -t filomat-backend .
