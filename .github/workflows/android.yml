name: Android

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - run: gradle assembleDebug testDebugUnitTest --no-daemon
