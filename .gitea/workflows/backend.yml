name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".dockerignore"
      - ".gitea/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - ".dockerignore"
      - ".gitea/workflows/backend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Das Runner-Image hat anders als das von GitHub kein ICU; ohne bricht dotnet sofort ab
      - name: ICU installieren
        run: |
          command -v sudo >/dev/null && SUDO=sudo || SUDO=
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq libicu-dev >/dev/null
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test
      - name: Docker-Image bauen (mit Web-Oberfläche)
        working-directory: .
        run: docker build -f backend/Dockerfile -t filomat-backend .

  # Fertiges Image für den Updater im LXC nach Docker Hub, Tags latest und sha-<Commit>. Läuft auf dem Docker-Runner
  # (Label ubuntu-latest). Secrets im Gitea-Repo: DOCKERHUB_USERNAME und DOCKERHUB_TOKEN (Access Token mit Read & Write);
  # fehlen sie, wird das Image nur gebaut, nicht hochgeladen, und der Updater baut im LXC selbst.
  # Standard nur amd64 (der LXC auf dem NUC); arm64 dazu mit der Repo-Variable IMAGE_PLATFORMS=linux/amd64,linux/arm64.
  # Das Dockerfile kompiliert für arm64 auf dem Build-Rechner, unter QEMU läuft nur die letzte Stufe.
  image:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/marcelbenders/fil-o-mat-backend
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Hub-Zugang
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME oder DOCKERHUB_TOKEN fehlt, das Image wird nur gebaut"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: contains(vars.IMAGE_PLATFORMS, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          push: ${{ steps.hub.outputs.enabled == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://gitea.idsrv.info/Marcel/fil-o-mat
          # Der Cache von GitHub (type=gha) fehlt in Gitea; er liegt als eigener Tag bei Docker Hub
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ steps.hub.outputs.enabled == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
