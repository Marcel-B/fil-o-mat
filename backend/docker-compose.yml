services:
  filomat:
    # Kontext ist der Wurzelordner, damit die Web-Oberfläche (web/) mit ins Image kommt
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "${FILOMAT_PORT:-8080}:8080"
    volumes:
      - filomat-data:/data
    environment:
      # Optional (z. B. in backend/.env): API-Schlüssel, den die Apps im Header X-Api-Key mitschicken
      Filomat__ApiKey: "${FILOMAT_API_KEY:-}"
      # Optional: nächtliche Sicherung in die Nextcloud (siehe README)
      NEXTCLOUD_WEBDAV_URL: "${NEXTCLOUD_WEBDAV_URL:-}"
      NEXTCLOUD_USERNAME: "${NEXTCLOUD_USERNAME:-}"
      NEXTCLOUD_APP_PASSWORD: "${NEXTCLOUD_APP_PASSWORD:-}"
      # Optional: Meldungen über Onkel Bummel, falls in der App kein Ziel eingestellt ist (siehe README)
      Notifications__Server: "${NOTIFICATIONS_SERVER:-}"
      Notifications__Topic: "${NOTIFICATIONS_TOPIC:-}"
      Notifications__Token: "${NOTIFICATIONS_TOKEN:-}"
      # Optional: /metrics für Prometheus und Logzeilen an Loki (siehe README, „Überwachung“)
      Monitoring__Metrics: "${MONITORING_METRICS:-false}"
      Monitoring__Loki__Url: "${MONITORING_LOKI_URL:-}"
      Monitoring__Loki__Host: "${MONITORING_LOKI_HOST:-}"
      TZ: Europe/Berlin
    restart: unless-stopped

volumes:
  filomat-data:
