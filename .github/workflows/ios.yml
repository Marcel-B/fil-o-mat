name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"

jobs:
  build-and-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      # Neuestes Xcode wie beim TestFlight-Build (mindestens 27, sonst lehnt App Store Connect ab April 2027 ab)
      - name: Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          version=$(basename "$xcode" .app); version=${version#Xcode_}
          (( ${version%%.*} >= 27 )) || { echo "::error::kein Xcode 27 auf dem Runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Für Gerät bauen (ohne Signierung, inkl. CoreNFC)
        run: |
          xcodebuild build \
            -project Filomat.xcodeproj \
            -scheme Filomat \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Für den Mac bauen (Mac Catalyst, ohne Signierung)
        run: |
          xcodebuild build \
            -project Filomat.xcodeproj \
            -scheme Filomat \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit-Tests im Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -project Filomat.xcodeproj \
            -scheme Filomat \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -testLanguage de -testRegion DE \
            CODE_SIGNING_ALLOWED=NO
