name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - ".dockerignore"
      - ".github/workflows/backend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test
      - name: Docker-Image bauen (mit Web-Oberfläche)
        working-directory: .
        run: docker build -f backend/Dockerfile -t filomat-backend .

  # Fertiges Image für den Updater im LXC (amd64 und arm64), Tags latest und sha-<Commit>.
  # Das Paket muss einmal auf öffentlich stehen (GitHub → Packages → fil-o-mat-backend → Package settings).
  image:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Zusätzlich nach Docker Hub, wenn DOCKERHUB_USERNAME und DOCKERHUB_TOKEN als Secrets gesetzt sind
      - name: Docker-Hub-Tags
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            repo="docker.io/${DOCKERHUB_USERNAME,,}/fil-o-mat-backend"
            { echo "enabled=true"; echo "tags<<EOF"; echo "$repo:latest"; echo "$repo:sha-$GITHUB_SHA"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/marcel-b/fil-o-mat-backend:latest
            ghcr.io/marcel-b/fil-o-mat-backend:sha-${{ github.sha }}
            ${{ steps.hub.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
